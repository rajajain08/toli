name: deploy dev

# Merge to main deploys rules, indexes, functions and the App Hosting backend to toli-app-dev.
# Enable by setting the repository variable DEPLOY_DEV=true and the secret
# FIREBASE_SERVICE_ACCOUNT_DEV (a service-account JSON with Firebase Admin, Cloud Functions
# Developer, Secret Manager Secret Accessor and Firebase App Hosting Admin).

on:
  push:
    branches: [main]

jobs:
  deploy:
    if: ${{ vars.DEPLOY_DEV == 'true' }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: write credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}' > "$RUNNER_TEMP/sa.json"
      - run: pnpm exec firebase deploy --only firestore,functions,apphosting --project toli-app-dev --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
