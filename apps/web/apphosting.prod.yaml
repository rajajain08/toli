# Production overrides, merged over apphosting.yaml when the backend's environment name is "prod"
# (App Hosting → toli-web → Settings → Environment). The web config values are public by design; App Check
# and the security rules protect the backend.
runConfig:
  # Scales to zero for now (ADR-0014). The invite landing page is server-rendered, so its first open after a
  # quiet spell pays a cold start; set this to 1 when real traffic makes that matter.
  minInstances: 0
  maxInstances: 10

env:
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: toli-app-prod
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: toli-app-prod.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyDpzBwcpBO9ZQTkoN0tN3rTYNa5CRintRU
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: '1:1018732932085:web:5401a611aaf3d48e670ebc'
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_APPCHECK_SITE_KEY
    value: 6LdDHsQtAAAAABKRqZCbJlWHFoGiYqU609qdu5cI
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://toli-web--toli-app-prod.asia-southeast1.hosted.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_USE_EMULATORS
    value: '0'
    availability: [BUILD, RUNTIME]
