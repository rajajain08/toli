# Firebase App Hosting backend "toli-web" (asia-southeast1, rootDir apps/web). The web config values
# are public by design; App Check and rules protect the backend. Deploy from local source with
#   pnpm exec firebase deploy --only apphosting --project dev
runConfig:
  minInstances: 0
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: toli-app-dev
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: toli-app-dev.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyA2XetanjTy21ICrky8ILO01lJ18sbfTD8
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: '1:319596181148:web:de29d2c6283055e5145f59'
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_APPCHECK_SITE_KEY
    value: 6Ldy0MMtAAAAAI15G67XYLO0zqGsuTSw2Nv67WdA
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://toli-web--toli-app-dev.asia-southeast1.hosted.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_GRIEVANCE_EMAIL
    value: rajajain08@gmail.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_USE_EMULATORS
    value: '0'
    availability: [BUILD, RUNTIME]
  - variable: NEXT_TELEMETRY_DISABLED
    value: '1'
    availability: [BUILD]
