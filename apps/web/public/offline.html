<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F6FC" />
    <title>Offline · Toli</title>
    <style>
      html,
      body {
        margin: 0;
        background: #f5f6fc;
        color: #0f0e1c;
        font-family: system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        padding: 72px 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      h1 {
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-weight: 500;
        font-size: 28px;
        line-height: 1.12;
      }
      p {
        margin: 0;
        font-size: 15px;
        line-height: 1.5;
        color: #55546b;
      }
      button {
        margin-top: 8px;
        height: 52px;
        border: 0;
        border-radius: 26px;
        background: #0f0e1c;
        color: #fff;
        font:
          600 16px system-ui,
          sans-serif;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>
        Toli can’t reach the network right now. Screens you have opened before still work; this one
        needs a connection the first time.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
