<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Anthropic Sans', system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #FAF9F5; color: #141413; -webkit-font-smoothing: antialiased; }
    a { color: #141413; } a:hover { color: #D97757; }
    button { font-family: inherit; cursor: pointer; }
  </style>
</helmet>
<div style="width: 390px; height: 1060px; box-sizing: border-box; background: radial-gradient(120% 55% at 50% 0%, rgba(217,119,87,0.13), rgba(250,249,245,0) 60%), #FAF9F5; display: flex; flex-direction: column;">

  <div style="padding: 52px 24px 0; display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <a href="Groups.dc.html" aria-label="Back to groups" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; color: #141413;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </a>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
        <h1 style="margin: 0; font-family: 'Anthropic Serif', Georgia, 'Times New Roman', Times, serif; font-weight: 500; font-size: 24px; line-height: 1.15;">Weekend Crew</h1>
        <div style="font-size: 14px; color: #5E5D59;">{{ summary }}</div>
      </div>
      <button type="button" aria-label="Group settings" style="width: 44px; height: 44px; border: 0.5px solid rgba(31,30,29,0.3); background: #FFFFFF; color: #141413; border-radius: 22px; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
    </div>

    <div style="display: flex; gap: 14px; overflow: hidden; margin-right: -24px;">
      <sc-for list="{{ avatars }}" as="m" hint-placeholder-count="5">
        <button type="button" onClick="{{ m.pick }}" aria-pressed="{{ m.selected }}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; background: transparent; padding: 0; width: 56px;">
          <div style="{{ m.circleStyle }}">{{ m.initial }}</div>
          <div style="{{ m.labelStyle }}">{{ m.label }}</div>
        </button>
      </sc-for>
      <button type="button" aria-label="Invite someone" style="display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; background: transparent; padding: 0; width: 56px;">
        <div style="width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF; color: #141413; display: flex; align-items: center; justify-content: center; border: 0.5px solid rgba(31,30,29,0.3); box-shadow: 0 2px 6px rgba(20,20,19,0.12);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></div>
        <div style="font-size: 12px; color: #5E5D59;">Invite</div>
      </button>
    </div>

    <div style="display: flex; gap: 8px; overflow: hidden;">
      <sc-for list="{{ chips }}" as="c" hint-placeholder-count="5">
        <button type="button" onClick="{{ c.pick }}" aria-pressed="{{ c.selected }}" style="{{ c.style }}">{{ c.label }}</button>
      </sc-for>
    </div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 18px 24px 0; display: flex; flex-direction: column; gap: 20px;">
    <sc-for list="{{ people }}" as="p" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 10px; padding: 0 2px;">
          <div style="{{ p.avatarStyle }}">{{ p.initial }}</div>
          <div style="font-size: 15px; font-weight: 600;">{{ p.label }}</div>
          <div style="font-size: 13px; color: #5E5D59;">{{ p.countLabel }}</div>
        </div>
        <sc-for list="{{ p.cards }}" as="c" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 0.5px solid rgba(31,30,29,0.10); border-radius: 16px; box-shadow: 0 1px 2px rgba(20,20,19,0.04), 0 12px 28px -16px rgba(20,20,19,0.22); padding: 12px;">
            <div style="{{ c.cardStyle }}"><div style="width: 11px; height: 8px; border-radius: 2px; background: #E3DACC;"></div><div style="height: 3px; width: 26px; border-radius: 2px; background: rgba(255,255,255,0.55);"></div></div>
            <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px;">
              <div style="font-size: 15px; font-weight: 600;">{{ c.name }}</div>
              <div style="display: flex; gap: 6px;">
                <sc-for list="{{ c.tags }}" as="t" hint-placeholder-count="2">
                  <span style="font-size: 12px; font-weight: 500; padding: 3px 8px; border-radius: 8px; background: #F0EEE6; color: #3D3D3A;">{{ t.label }}</span>
                </sc-for>
              </div>
            </div>
          </div>
        </sc-for>
        <sc-if value="{{ p.isEmpty }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; align-items: center; gap: 12px; border: 1px dashed rgba(31,30,29,0.3); border-radius: 14px; padding: 12px 14px;">
            <div style="flex-grow: 1; font-size: 14px; color: #5E5D59;">Hasn't added any cards yet</div>
            <button type="button" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 0.5px solid rgba(31,30,29,0.3); background: #FFFFFF; color: #141413; font-size: 14px; font-weight: 600;">Nudge</button>
          </div>
        </sc-if>
        <sc-if value="{{ p.noMatch }}" hint-placeholder-val="{{ false }}">
          <div style="font-size: 14px; color: #9C9A92; padding: 4px 2px;">{{ p.noMatchLabel }}</div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <nav style="display: flex; gap: 8px; padding: 10px 24px 24px; background: rgba(255,255,255,0.78); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 0.5px solid rgba(31,30,29,0.08); box-shadow: 0 -10px 30px -18px rgba(20,20,19,0.25);">
    <a href="Groups.dc.html" style="flex-grow: 1; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{accent}}; font-size: 12px; font-weight: 600;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      <span>Groups</span>
    
      <span style="width: 4px; height: 4px; border-radius: 2px; background: #D97757; display: block; margin-top: -2px;"></span>
    </a>
    <a href="Search.dc.html" style="flex-grow: 1; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E5D59; font-size: 12px; font-weight: 500;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <span>Find</span>
    </a>
    <a href="MyCards.dc.html" style="flex-grow: 1; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E5D59; font-size: 12px; font-weight: 500;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
      <span>My cards</span>
    </a>
  </nav>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#141413","options":["#141413","#D97757","#2A78D6","#558A42"]},"$preview":{"width":390,"height":1060}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { person: 'all', cat: 'all' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#141413';
    const members = [
      { id: 'all', initial: 'All', label: 'Everyone', bg: '#141413' },
      { id: 'rahul', initial: 'R', label: 'Rahul', bg: '#558A42', note: 'added Atlas yesterday' },
      { id: 'priya', initial: 'P', label: 'Priya', bg: '#D97757' },
      { id: 'you', initial: 'Y', label: 'You', bg: '#141413' },
      { id: 'arjun', initial: 'A', label: 'Arjun', bg: '#F0EEE6', empty: true }
    ];
    const cats = [
      { id: 'all', label: 'Everyone' }, { id: 'dining', label: 'Dining' }, { id: 'travel', label: 'Travel' },
      { id: 'shopping', label: 'Shopping' }, { id: 'fuel', label: 'Fuel' }
    ];
    const cards = [
      { owner: 'rahul', name: 'Axis Atlas', color: '#262624', tags: ['Travel', 'Lounge access'], cats: ['travel'] },
      { owner: 'rahul', name: 'HDFC Millennia', color: '#6B4D9E', tags: ['Shopping', '5% online'], cats: ['shopping'] },
      { owner: 'priya', name: 'HDFC Regalia Gold', color: '#C9A82D', tags: ['Dining', 'Lounge access'], cats: ['dining', 'travel'] },
      { owner: 'priya', name: 'Amazon Pay ICICI', color: '#2E9191', tags: ['Shopping', '5% Amazon'], cats: ['shopping'] },
      { owner: 'you', name: 'SBI Cashback', color: '#558A42', tags: ['Shopping', '5% online'], cats: ['shopping'] },
      { owner: 'you', name: 'Flipkart Axis', color: '#C46686', tags: ['Shopping', 'Dining'], cats: ['shopping', 'dining'] }
    ];
    const { person, cat } = this.state;
    const avatars = members.map((m) => {
      const sel = m.id === person;
      const border = sel ? '2px solid #141413' : (m.empty ? '2px dashed rgba(31,30,29,0.3)' : '2px solid #FAF9F5');
      const shadow = sel ? '0 0 0 3px rgba(217,119,87,0.4), 0 2px 6px rgba(20,20,19,0.2)' : '0 2px 6px rgba(20,20,19,0.2)';
      return {
        ...m, selected: sel,
        circleStyle: `width:48px;height:48px;border-radius:24px;background:${m.bg};color:${m.empty ? '#9C9A92' : '#FFFFFF'};display:flex;align-items:center;justify-content:center;font-size:${m.id === 'all' ? 13 : 17}px;font-weight:600;border:${border};box-shadow:${shadow};box-sizing:border-box;`,
        labelStyle: `font-size:12px;font-weight:${sel ? 600 : 500};color:${sel ? '#141413' : (m.empty ? '#9C9A92' : '#5E5D59')};`,
        pick: () => this.setState({ person: m.id })
      };
    });
    const chips = cats.map((c) => {
      const sel = c.id === cat;
      return {
        ...c, selected: sel,
        style: sel
          ? `height:38px;padding:0 16px;border-radius:19px;border:1px solid ${accent};background:${accent};color:#FFFFFF;font-size:14px;font-weight:600;white-space:nowrap;box-shadow:0 8px 18px -10px rgba(20,20,19,0.55);`
          : 'height:38px;padding:0 16px;border-radius:19px;border:0.5px solid rgba(31,30,29,0.3);background:#FFFFFF;color:#141413;font-size:14px;font-weight:500;white-space:nowrap;',
        pick: () => this.setState({ cat: c.id })
      };
    });
    const catLabel = (cats.find((c) => c.id === cat) || {}).label;
    let shown = 0;
    const people = members.filter((m) => m.id !== 'all' && (person === 'all' || m.id === person)).map((m) => {
      const mine = cards.filter((c) => c.owner === m.id);
      const list = mine.filter((c) => cat === 'all' || c.cats.includes(cat)).map((c) => ({
        ...c,
        tags: c.tags.map((t) => ({ label: t })),
        cardStyle: `width:56px;height:36px;border-radius:6px;background:${c.color};background-image:linear-gradient(135deg,rgba(255,255,255,0.36) 0%,rgba(255,255,255,0.06) 42%,rgba(20,20,19,0.24) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,0.28),0 3px 8px rgba(20,20,19,0.20);flex-shrink:0;box-sizing:border-box;padding:6px 7px;display:flex;flex-direction:column;justify-content:space-between;`
      }));
      shown += list.length;
      const n = mine.length;
      return {
        ...m,
        cards: list,
        isEmpty: n === 0,
        noMatch: n > 0 && list.length === 0,
        noMatchLabel: `No ${catLabel ? catLabel.toLowerCase() : ''} cards`,
        countLabel: n === 0 ? '' : `${n} card${n === 1 ? '' : 's'}${m.note ? ' · ' + m.note : ''}`,
        avatarStyle: `width:28px;height:28px;border-radius:14px;background:${m.bg};color:${m.empty ? '#9C9A92' : '#FFFFFF'};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;box-shadow:0 2px 6px rgba(20,20,19,0.2);`
      };
    });
    const summary = cat === 'all' && person === 'all' ? `4 members · ${cards.length} cards` : `Showing ${shown} of ${cards.length} cards`;
    return { accent, avatars, chips, people, summary };
  }
}
</script>
</body>
</html>
