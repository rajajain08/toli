<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Anthropic Sans', system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #FAF9F5; color: #141413; -webkit-font-smoothing: antialiased; }
    a { color: #141413; } a:hover { color: #D97757; }
    button { font-family: inherit; cursor: pointer; }
  </style>
</helmet>
<div style="width: 390px; height: 1060px; box-sizing: border-box; background: radial-gradient(120% 55% at 50% 0%, rgba(217,119,87,0.13), rgba(250,249,245,0) 60%), #FAF9F5; display: flex; flex-direction: column;">

  <div style="padding: 56px 24px 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <h1 style="margin: 0; font-family: 'Anthropic Serif', Georgia, 'Times New Roman', Times, serif; font-weight: 500; font-size: 28px; line-height: 1.12;">My cards</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #5E5D59;">3 cards · <a href="Privacy.dc.html" style="font-weight: 600;">what friends see</a></p>
    </div>
    <a href="AddCards.dc.html" aria-label="Add a card" style="width: 44px; height: 44px; border-radius: 22px; background: {{accent}}; color: #FFFFFF; box-shadow: 0 10px 22px -10px rgba(20,20,19,0.55); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </a>
  </div>

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 20px; padding-top: 20px;">

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div style="overflow: hidden; padding: 0 24px;">
        <div style="{{ trackStyle }}">
          <sc-for list="{{ wallet }}" as="w" hint-placeholder-count="3">
            <button type="button" onClick="{{ w.pick }}" aria-pressed="{{ w.selected }}" aria-label="{{ w.aria }}" style="{{ w.style }}">
              <div style="display: flex; align-items: flex-start; justify-content: space-between; width: 100%;">
                <div style="width: 38px; height: 28px; border-radius: 6px; background: #E3DACC;"></div>
                <div style="font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.85); letter-spacing: 0.06em;">{{ w.issuer }}</div>
              </div>
              <div style="display: flex; flex-direction: column; gap: 4px; align-items: flex-start;">
                <div style="font-family: 'Anthropic Serif', Georgia, 'Times New Roman', Times, serif; font-size: 22px; font-weight: 500; color: #FFFFFF;">{{ w.name }}</div>
                <div style="font-size: 13px; color: rgba(255,255,255,0.85);">{{ w.visibleLabel }}</div>
              </div>
            </button>
          </sc-for>
        </div>
      </div>
      <div style="display: flex; justify-content: center; gap: 6px;">
        <sc-for list="{{ dots }}" as="d" hint-placeholder-count="3">
          <button type="button" onClick="{{ d.pick }}" aria-label="{{ d.aria }}" style="{{ d.style }}"></button>
        </sc-for>
      </div>
    </div>

    <div style="padding: 0 24px; display: flex; flex-direction: column; gap: 20px;">

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <div style="font-size: 12px; font-weight: 600; color: #5E5D59; text-transform: uppercase; letter-spacing: 0.08em;">Perks we know about</div>
          <button type="button" style="height: 28px; padding: 0 4px; border: 0; background: transparent; color: #9C4A31; font-size: 13px; font-weight: 600;">Wrong?</button>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 6px;">
          <sc-for list="{{ perks }}" as="p" hint-placeholder-count="3">
            <span style="font-size: 13px; font-weight: 500; padding: 6px 10px; border-radius: 9px; background: #F0EEE6; color: #3D3D3A;">{{ p.label }}</span>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div style="font-size: 12px; font-weight: 600; color: #5E5D59; text-transform: uppercase; letter-spacing: 0.08em;">Who can see this card</div>
        <div style="background: #FFFFFF; border: 0.5px solid rgba(31,30,29,0.10); border-radius: 16px; box-shadow: 0 1px 2px rgba(20,20,19,0.04), 0 12px 28px -16px rgba(20,20,19,0.22); padding: 6px 14px; display: flex; flex-direction: column;">
          <sc-for list="{{ audiences }}" as="a" hint-placeholder-count="4">
            <div style="{{ a.rowStyle }}">
              <sc-if value="{{ a.isGroup }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E5D59" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></sc-if>
              <sc-if value="{{ a.isPerson }}" hint-placeholder-val="{{ false }}"><div style="{{ a.avatarStyle }}">{{ a.initial }}</div></sc-if>
              <div style="flex-grow: 1; font-size: 15px; font-weight: 500;">{{ a.label }}</div>
              <button type="button" onClick="{{ a.flip }}" aria-pressed="{{ a.on }}" aria-label="{{ a.aria }}" style="{{ a.toggleStyle }}"><span style="width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF; display: block; box-shadow: 0 1px 3px rgba(20,20,19,0.25);"></span></button>
            </div>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <div style="font-size: 12px; font-weight: 600; color: #5E5D59; text-transform: uppercase; letter-spacing: 0.08em;">People you share with</div>
          <a href="Share.dc.html" style="font-size: 13px; font-weight: 600; text-decoration: none; color: #9C4A31; display: flex; align-items: center; gap: 4px; min-height: 32px;">Add person</a>
        </div>
        <a href="Share.dc.html" style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 0.5px solid rgba(31,30,29,0.10); border-radius: 16px; box-shadow: 0 1px 2px rgba(20,20,19,0.04), 0 12px 28px -16px rgba(20,20,19,0.22); padding: 12px 14px; text-decoration: none; color: #141413;">
          <div style="width: 36px; height: 36px; border-radius: 18px; background: #6B4D9E; color: #FFFFFF; display: flex; box-shadow: 0 2px 6px rgba(20,20,19,0.20); align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">M</div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
            <div style="font-size: 15px; font-weight: 600;">Meera</div>
            <div style="font-size: 13px; color: #5E5D59;">{{ meeraLabel }}</div>
          </div>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9C9A92" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </a>
        <a href="Share.dc.html" style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 0.5px solid rgba(31,30,29,0.10); border-radius: 16px; box-shadow: 0 1px 2px rgba(20,20,19,0.04), 0 12px 28px -16px rgba(20,20,19,0.22); padding: 12px 14px; text-decoration: none; color: #141413;">
          <div style="width: 36px; height: 36px; border-radius: 18px; background: #2E9191; color: #FFFFFF; display: flex; box-shadow: 0 2px 6px rgba(20,20,19,0.20); align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">D</div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
            <div style="font-size: 15px; font-weight: 600;">Dev</div>
            <div style="font-size: 13px; color: #5E5D59;">{{ devLabel }}</div>
          </div>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9C9A92" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </a>
      </div>

    </div>
  </div>

  <nav style="display: flex; gap: 8px; padding: 10px 24px 24px; background: rgba(255,255,255,0.78); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 0.5px solid rgba(31,30,29,0.08); box-shadow: 0 -10px 30px -18px rgba(20,20,19,0.25);">
    <a href="Groups.dc.html" style="flex-grow: 1; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E5D59; font-size: 12px; font-weight: 500;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      <span>Groups</span>
    </a>
    <a href="Search.dc.html" style="flex-grow: 1; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E5D59; font-size: 12px; font-weight: 500;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <span>Find</span>
    </a>
    <a href="MyCards.dc.html" style="flex-grow: 1; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{accent}}; font-size: 12px; font-weight: 600;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
      <span>My cards</span>
    
      <span style="width: 4px; height: 4px; border-radius: 2px; background: #D97757; display: block; margin-top: -2px;"></span>
    </a>
  </nav>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#141413","options":["#141413","#D97757","#2A78D6","#558A42"]},"$preview":{"width":390,"height":1060}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      sel: 0,
      vis: {
        sbi: { wc: true, ol: true, meera: true, dev: false },
        flip: { wc: true, ol: false, meera: true, dev: false },
        mill: { wc: false, ol: false, meera: false, dev: false }
      }
    };
  }
  renderVals() {
    const accent = this.props.accent ?? '#141413';
    const cards = [
      { id: 'sbi', name: 'SBI Cashback', issuer: 'SBI CARD', color: '#558A42', perks: ['5% online shopping', '1% everywhere else', 'No lounge access'] },
      { id: 'flip', name: 'Flipkart Axis', issuer: 'AXIS BANK', color: '#C46686', perks: ['5% on Flipkart', '4% on partner dining', 'Fuel surcharge waiver'] },
      { id: 'mill', name: 'HDFC Millennia', issuer: 'HDFC BANK', color: '#6B4D9E', perks: ['5% on Amazon, Swiggy, Zomato', '1% everywhere else', '8 lounge visits a year'] }
    ];
    const audienceList = [
      { id: 'wc', label: 'Weekend Crew', kind: 'group' },
      { id: 'ol', label: 'Office lunch', kind: 'group' },
      { id: 'meera', label: 'Meera', kind: 'person', bg: '#6B4D9E', initial: 'M' },
      { id: 'dev', label: 'Dev', kind: 'person', bg: '#2E9191', initial: 'D' }
    ];
    const { sel, vis } = this.state;
    const visibleCount = (id) => Object.values(vis[id]).filter(Boolean).length;
    const describe = (id) => {
      const v = vis[id];
      const g = ['wc', 'ol'].filter((k) => v[k]).length;
      const p = ['meera', 'dev'].filter((k) => v[k]).length;
      if (g + p === 0) return 'Private — only you';
      const parts = [];
      if (g) parts.push(`${g} group${g === 1 ? '' : 's'}`);
      if (p) parts.push(`${p} ${p === 1 ? 'person' : 'people'}`);
      return `Visible to ${g + p} · ${parts.join(', ')}`;
    };
    const wallet = cards.map((c, i) => {
      const selected = i === sel;
      return {
        ...c, selected, aria: `Select ${c.name}`, visibleLabel: describe(c.id),
        style: `width:290px;height:182px;border-radius:18px;border:0;text-align:left;background:${c.color};background-image:linear-gradient(135deg,rgba(255,255,255,0.36) 0%,rgba(255,255,255,0.06) 42%,rgba(20,20,19,0.24) 100%);flex-shrink:0;box-sizing:border-box;padding:20px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:${selected ? 'inset 0 1px 0 rgba(255,255,255,0.3), 0 16px 36px -12px rgba(20,20,19,0.35)' : 'inset 0 1px 0 rgba(255,255,255,0.3), 0 8px 20px -12px rgba(20,20,19,0.25)'};opacity:${selected ? 1 : 0.88};transform:scale(${selected ? 1 : 0.96});transition:transform 200ms ease, opacity 200ms ease;`,
        pick: () => this.setState({ sel: i })
      };
    });
    const dots = cards.map((c, i) => ({
      aria: `Show ${c.name}`,
      style: `width:${i === sel ? 18 : 6}px;height:6px;border-radius:3px;border:0;padding:0;background:${i === sel ? '#141413' : '#C2C0B6'};transition:width 200ms ease;`,
      pick: () => this.setState({ sel: i })
    }));
    const current = cards[sel];
    const perks = current.perks.map((p) => ({ label: p }));
    const audiences = audienceList.map((a, i) => {
      const on = !!vis[current.id][a.id];
      return {
        ...a, on, isGroup: a.kind === 'group', isPerson: a.kind === 'person',
        aria: `${on ? 'Visible to' : 'Hidden from'} ${a.label}`,
        rowStyle: `display:flex;align-items:center;gap:12px;min-height:52px;${i < audienceList.length - 1 ? 'border-bottom:0.5px solid rgba(31,30,29,0.1);' : ''}`,
        avatarStyle: `width:18px;height:18px;border-radius:9px;background:${a.bg};color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;`,
        toggleStyle: `width:48px;height:28px;border-radius:14px;border:0;padding:2px;background:${on ? accent : '#C2C0B6'};display:flex;justify-content:${on ? 'flex-end' : 'flex-start'};align-items:center;transition:background 200ms ease;`,
        flip: () => this.setState({ vis: { ...vis, [current.id]: { ...vis[current.id], [a.id]: !on } } })
      };
    });
    const sees = (who) => cards.filter((c) => vis[c.id][who]).length;
    const m = sees('meera'), d = sees('dev');
    return {
      accent, wallet, dots, perks, audiences,
      trackStyle: `display:flex;gap:12px;transform:translateX(-${sel * 302}px);transition:transform 250ms ease;`,
      meeraLabel: `Sees ${m} of your cards · shares 3 with you`,
      devLabel: d === 0 ? 'Sees none yet · invite sent' : `Sees ${d} of your cards · invite sent`
    };
  }
}
</script>
</body>
</html>
